[project]
name = "reranker-simple-benchmark"
version = "0.1.0"
description = "https://instruct.kr"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bm25s==0.2.12",
    "einops>=0.8.1",
    "flagembedding>1.3.5",
    "kiwipiepy==0.19.0",
    "konlpy==0.6.0",
    "mteb>=2.18.0",
    "mxbai-rerank>=0.1.6",
    "sentence-transformers>=5.0",
    "transformers>=4.40.0,<6.0.0",
    "torch>=2.5.1",
    "torchvision",
    "peft>=0.20.0",
    "python-mecab-ko",
    "accelerate",
    "setproctitle>=1.3.7",
    "streamlit==1.39.0",
]

[project.optional-dependencies]
transformers-v4 = ["transformers<5"]
transformers-v5 = ["transformers>=5"]

[tool.uv]
# 단일 universal lock 에서 두 extra 가 하나의 transformers 버전으로 합쳐지지 않도록 분기.
conflicts = [[{ extra = "transformers-v4" }, { extra = "transformers-v5" }]]
